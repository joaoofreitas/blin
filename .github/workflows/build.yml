name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build TUI
        run: GOOS=linux GOARCH=amd64 go build -o dist/blin ./cmd/tui
      - name: Build CLI
        run: GOOS=linux GOARCH=amd64 go build -o dist/blin-cli ./cmd/cli
      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blin-linux-x64
          path: dist/blin
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blin-cli-linux-x64
          path: dist/blin-cli

  release:
    needs: linux-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download TUI artifact
        uses: actions/download-artifact@v4
        with:
          name: blin-linux-x64
          path: release
      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: blin-cli-linux-x64
          path: release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/blin
            release/blin-cli
